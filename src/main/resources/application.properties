spring.application.name=account-management
server.port=8081

# MySQL database connection
# Secrets (password) and environment-specific values are supplied via environment variables.
# Local dev falls back to the defaults after the ':' ; Docker/AWS override via env vars (.env / task def).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/account_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Shared JWT secret — no default: must be supplied via env var and identical across all services
jwt.secret=${JWT_SECRET}

# auth-service URL for blacklist check
auth.service.base_url=${AUTH_SERVICE_BASE_URL:http://localhost:8080/}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
